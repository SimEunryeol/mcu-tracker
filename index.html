<meta name="theme-color" content="#F2F3F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12141A" media="(prefers-color-scheme: dark)">
<meta name="description" content="디즈니+ 마블 실사 영화·드라마 시대순 정주행 체크리스트 (애니메이션 제외)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MCU 정주행">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F2F3F6;
    --panel:#FFFFFF;
    --ink:#0E1116;
    --muted:#6B7280;
    --hair:#DFE2E8;
    --done:#9AA1AC;
    --line:#EEF0F3; --boxb:#C4C9D2;
    --c1:#E1006E; --c2:#F5A300; --c3:#0090D4; --c4:#7A4FBF;
    --c5:#C8102E; --c6:#0F8A5F; --c7:#1B2A6B; --c8:#FF4D00;
    --c9:#0B7285; --c10:#B5179E; --c11:#D62828; --c12:#2B2D42; --c13:#58616E;
    --c14:#A8341F; --c15:#4A6D2E; --c16:#6E5A46;
  }

  /* ── 다크 ── 뷰어가 시스템 설정이면 표식이 없으므로 미디어 쿼리로, 직접 고르면 data-theme으로 ── */
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --paper:#12141A; --panel:#191C23; --ink:#E8EAEE; --muted:#99A1AD;
      --hair:#2A2F39; --done:#69717E; --line:#242832; --boxb:#3C424E;
      --c4:#9B77E0; --c5:#E8455C; --c6:#22B47E; --c7:#5B72D8;
      --c9:#17A2B8; --c11:#F05555; --c12:#8189C4; --c13:#8A94A3;
    --c14:#D9634A; --c15:#8CB35E; --c16:#B39B84;
      --c14:#D9634A; --c15:#8CB35E; --c16:#B39B84;
    }
  }
  :root[data-theme="dark"]{
    --paper:#12141A; --panel:#191C23; --ink:#E8EAEE; --muted:#99A1AD;
    --hair:#2A2F39; --done:#69717E; --line:#242832; --boxb:#3C424E;
    --c4:#9B77E0; --c5:#E8455C; --c6:#22B47E; --c7:#5B72D8;
    --c9:#17A2B8; --c11:#F05555; --c12:#8189C4; --c13:#8A94A3;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans KR',system-ui,sans-serif;
    font-size:15px;line-height:1.5;
    padding-bottom:80px;
  }
  .wrap{max-width:720px;margin:0 auto;padding:0 14px}

  /* ── 헤더 ── */
  header{
    position:sticky;top:0;z-index:20;
    background:color-mix(in srgb, var(--paper) 93%, transparent);
    backdrop-filter:saturate(1.4) blur(12px);
    border-bottom:1px solid var(--hair);
  }
  .htop{display:flex;align-items:baseline;gap:10px;padding:14px 0 8px}
  h1{font-family:'Black Han Sans',sans-serif;font-size:26px;letter-spacing:-.02em;line-height:1}
  .count{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;color:var(--muted);margin-left:auto;white-space:nowrap}
  .count b{color:var(--ink);font-size:16px}

  .gauge{height:6px;background:var(--hair);border-radius:99px;overflow:hidden}
  .gauge span{display:block;height:100%;width:0;border-radius:99px;
    background:linear-gradient(90deg,var(--c1),var(--c8) 45%,var(--c3) 75%,var(--c6));
    transition:width .5s cubic-bezier(.22,1,.36,1)}

  .next{display:flex;gap:8px;align-items:center;padding:9px 0 12px;font-size:13px;color:var(--muted);min-height:38px}
  .next em{font-style:normal;font-weight:600;color:var(--ink)}
  .next .tag{font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;
    letter-spacing:.08em;padding:2px 6px;border:1px solid var(--ink);border-radius:3px;flex:none}

  /* ── 툴바 ── */
  .bar{display:flex;gap:6px;padding:0 0 14px;flex-wrap:wrap}
  .chip{font:600 12px/1 'IBM Plex Sans KR',sans-serif;padding:8px 12px;border-radius:99px;
    border:1px solid var(--hair);background:var(--panel);color:var(--muted);cursor:pointer}
  .chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
  .chip.ghost{margin-left:auto;border-style:dashed}
  .chip:focus-visible,input:focus-visible+.box{outline:2px solid var(--c3);outline-offset:2px}

  /* ── 섹션 ── */
  section{margin-bottom:26px}
  .shead{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px 8px 0 0;
    background:var(--panel);border:1px solid var(--hair);border-bottom:none;position:relative;overflow:hidden}
  .shead::after{content:'';position:absolute;inset:0;pointer-events:none;
    background-image:radial-gradient(currentColor .8px,transparent .9px);
    background-size:7px 7px;opacity:.13;color:var(--sc)}
  .snum{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;color:#fff;
    background:var(--sc);padding:3px 6px;border-radius:3px;flex:none;position:relative;z-index:1}
  .stitle{font-family:'Black Han Sans',sans-serif;font-size:16px;letter-spacing:-.01em;position:relative;z-index:1}
  .sprog{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);position:relative;z-index:1}
  .snote{padding:8px 12px;font-size:12px;color:var(--muted);background:var(--panel);
    border-left:1px solid var(--hair);border-right:1px solid var(--hair)}
  ul{list-style:none;background:var(--panel);border:1px solid var(--hair);border-radius:0 0 8px 8px;overflow:hidden}

  /* ── 항목 (타임라인 척추) ── */
  li{display:flex;align-items:flex-start;gap:10px;padding:0 12px 0 0;position:relative}
  li+li .rail::before{content:'';position:absolute;top:0;bottom:50%;left:50%;width:2px;
    transform:translateX(-50%);background:var(--hair)}
  li .rail::after{content:'';position:absolute;top:50%;bottom:0;left:50%;width:2px;
    transform:translateX(-50%);background:var(--hair)}
  li:last-child .rail::after{display:none}
  li.on+li .rail::before,li.on .rail::after{background:var(--sc)}
  li.on .rail::before{background:var(--sc)}
  .rail{width:34px;flex:none;align-self:stretch;position:relative}
  .node{position:absolute;top:50%;left:50%;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;
    border-radius:50%;background:var(--paper);border:2px solid var(--hair);z-index:1;transition:.2s}
  li.on .node{background:var(--sc);border-color:var(--sc);transform:scale(1.15)}

  label.row{display:flex;align-items:center;gap:10px;flex:1;padding:11px 0;cursor:pointer;min-height:46px}
  li+li label.row{border-top:1px solid var(--line)}
  input{position:absolute;opacity:0;width:0;height:0}
  .box{width:20px;height:20px;flex:none;border:2px solid var(--boxb);border-radius:5px;
    display:grid;place-items:center;transition:.15s;background:var(--panel)}
  .box svg{width:12px;height:12px;stroke:#fff;stroke-width:3.5;fill:none;
    stroke-linecap:round;stroke-linejoin:round;opacity:0;transform:scale(.5);transition:.15s}
  li.on .box{background:var(--sc);border-color:var(--sc)}
  li.on .box svg{opacity:1;transform:scale(1)}
  .txt{flex:1;min-width:0}
  .name{font-size:14.5px;font-weight:500;letter-spacing:-.01em}
  li.on .name{color:var(--done);text-decoration:line-through;text-decoration-color:#C9CDD4}
  .meta{display:flex;gap:6px;align-items:center;margin-top:2px;font-family:'IBM Plex Mono',monospace;
    font-size:10.5px;color:var(--muted);letter-spacing:.02em}
  .kind{padding:1px 5px;border-radius:3px;background:var(--line);font-weight:600}
  .core{color:var(--c5);font-weight:600}
  .soon{color:var(--sc);font-weight:600;border:1px solid currentColor;border-radius:3px;padding:0 4px}

  .empty{padding:28px 14px;text-align:center;color:var(--muted);font-size:13px}
  footer{padding:8px 0 0;font-size:12px;color:var(--muted);line-height:1.6}
  .toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,20px);z-index:50;
    background:var(--ink);color:#fff;font-size:13px;padding:10px 16px;border-radius:99px;
    opacity:0;pointer-events:none;transition:.25s}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="htop">
      <h1>MCU 정주행</h1>
      <div class="count"><b id="cDone">0</b> / <span id="cAll">0</span> · <span id="cLeft">–</span> 남음</div>
    </div>
    <div class="gauge"><span id="gauge"></span></div>
    <div class="next" id="next"></div>
  </div>
</header>

<div class="wrap">
  <div class="bar">

    <button class="chip" id="fTodo" aria-pressed="false">안 본 것만</button>
    <button class="chip" id="fCore" aria-pressed="false">핵심만</button>
    <button class="chip ghost" id="reset">초기화</button>
  </div>
  <main id="list"><div class="empty">불러오는 중…</div></main>
  <footer>
    <span id="mode">체크 상태는 자동 저장됩니다.</span> 애니메이션을 제외한 디즈니+ 마블 실사 영화·드라마를 <b>작품 속 시대순</b>으로 묶었습니다. <b>핵심</b>은 그 라인의 줄거리를 따라가는 데 필요한 작품이고, 나머지는 건너뛰어도 이야기가 끊기지 않습니다.
    <span id="xnote"></span> 스파이더맨 시리즈와 「인크레더블 헐크」는 배급사 사정으로 디즈니+에 없는 시기가 있습니다.
  </footer>
</div>
<div class="toast" id="toast"></div>

const KEY='mcu:watched:v2', OLDKEY='mcu:watched:v1';
let done=new Set(), filter='all', mode='mem';
const $=s=>document.querySelector(s);
const list=$('#list');

/* 저장소: 앱 저장소 → 브라우저 저장소 → 세션 메모리 순으로 시도 */
const store={
  async read(){
    if(window.storage){
      try{const r=await window.storage.get(KEY);mode='app';
          if(r&&r.value)return JSON.parse(r.value);
          const o=await window.storage.get(OLDKEY);
          return o&&o.value?migrate(JSON.parse(o.value)):[]}
      catch(e){mode='app';return []}   // 키가 아직 없는 정상 상태
    }
    try{mode='local';
        const v=localStorage.getItem(KEY); if(v)return JSON.parse(v);
        const o=localStorage.getItem(OLDKEY); return o?migrate(JSON.parse(o)):[]}
    catch(e){mode='mem';return []}
  },
  async write(arr){
    const s=JSON.stringify(arr);
    if(mode==='app'){await window.storage.set(KEY,s);return}
    if(mode==='local'){localStorage.setItem(KEY,s);return}
    throw new Error('no-store');
  }
};

/* 구버전 기록은 "섹션번호|제목" 형태였다. 제목만 남겨 재분류 후에도 체크가 유지된다 */
const RENAMED={'가디언즈 홀리데이 스페셜':'가디언즈 오브 갤럭시 홀리데이 스페셜'};
function migrate(arr){
  const titles=new Set();
  DATA.forEach(s=>s.i.forEach(it=>titles.add(it[0])));
  const t=arr.map(v=>String(v).replace(/^[^|]*\|/,'')).map(v=>RENAMED[v]||v);
  return [...new Set(t)].filter(v=>titles.has(v));
}
function hrs(m){const h=Math.round(m/60);return h>=1?h+'시간':m+'분'}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove('show'),1800)}

async function load(){
  done=new Set(await store.read());
  render();
  $('#mode').textContent = mode==='mem'
    ? '이 환경에서는 기록이 저장되지 않습니다. 파일을 내려받아 브라우저로 열면 저장됩니다.'
    : '체크 상태는 자동 저장됩니다.';
}
let warned=false;
async function save(){
  try{await store.write([...done])}
  catch(e){ if(!warned){warned=true;
    toast('이 환경에선 기록이 남지 않습니다 (창을 닫으면 초기화)');} }
}

function render(){
  let all=0,dn=0,left=0,next=null,xAll=0,xDn=0;
  let html='';
  DATA.forEach(sec=>{
    let rows='',sAll=0,sDn=0;
    sec.i.forEach(([name,kind,mins,core,tag])=>{
      const id=name, on=done.has(id);
      sAll++; if(on)sDn++;
      if(sec.x){ xAll++; if(on)xDn++; }
      else{ all++; if(on)dn++; else{left+=mins; if(!next)next=[name,kind]} }
      if(filter==='todo'&&on)return;
      if(filter==='core'&&!core)return;
      rows+=`<li class="${on?'on':''}"><div class="rail"><div class="node"></div></div>
        <label class="row"><input type="checkbox" data-id="${id}" ${on?'checked':''}>
        <span class="box"><svg viewBox="0 0 14 14"><polyline points="2,7.5 5.5,11 12,3.5"/></svg></span>
        <span class="txt"><span class="name">${name}</span>
        <span class="meta"><span class="kind">${kind}</span><span>${hrs(mins)}</span>
        ${core?'<span class="core">핵심</span>':''}
        ${tag?`<span class="soon">${tag}</span>`:''}</span></span></label></li>`;
    });
    if(!rows)return;
    html+=`<section style="--sc:var(${sec.c})">
      <div class="shead"><span class="snum">${sec.n}</span><span class="stitle">${sec.t}</span>
      <span class="sprog">${sDn}/${sAll}</span></div>
      ${sec.note?`<div class="snote">${sec.note}</div>`:''}
      <ul>${rows}</ul></section>`;
  });
  list.innerHTML=html||`<div class="empty">이 조건에 맞는 작품이 없습니다.<br>필터를 바꿔 보세요.</div>`;
  $('#cDone').textContent=dn; $('#cAll').textContent=all; $('#cLeft').textContent=hrs(left);
  $('#gauge').style.width=(all?dn/all*100:0)+'%';
  $('#xnote').textContent = xAll
    ? `별책 ${xDn}/${xAll}편은 위 진행률에 포함되지 않습니다.` : '';
  $('#next').innerHTML = next
    ? `<span class="tag">다음</span><em>${next[0]}</em>`
    : (dn?`<span class="tag">완주</span><em>전부 보셨습니다. 이제 둠스데이만 남았습니다</em>`
        :`<span class="tag">시작</span><em>캡틴 아메리카: 퍼스트 어벤져부터 출발</em>`);
}

list.addEventListener('change',e=>{
  const el=e.target; if(el.type!=='checkbox')return;
  el.checked?done.add(el.dataset.id):done.delete(el.dataset.id);
  render(); save();
});
['all','todo','core'].forEach(k=>{
  $('#f'+k[0].toUpperCase()+k.slice(1)).onclick=()=>{
    filter=k;['All','Todo','Core'].forEach(x=>$('#f'+x).setAttribute('aria-pressed',
      x.toLowerCase()===k?'true':'false'));render();};
});
$('#reset').onclick=()=>{
  if(!done.size)return toast('아직 체크한 작품이 없습니다');
  if(confirm('체크한 기록을 전부 지웁니다. 되돌릴 수 없습니다.')){
    done.clear();render();save();toast('기록을 지웠습니다');}
};
load();
</script>
