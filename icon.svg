<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="MCU 정주행">
  <defs>
    <!-- 헤더 진행 게이지와 같은 그라디언트 -->
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E1006E"/>
      <stop offset=".45" stop-color="#FF4D00"/>
      <stop offset=".75" stop-color="#0090D4"/>
      <stop offset="1" stop-color="#0F8A5F"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="#0E1116"/>
  <g transform="translate(256 256)">
    <!-- 목록 체크박스의 체크 마크 -->
    <polyline points="-96,4 -30,70 96,-72" fill="none" stroke="#F2F3F6"
              stroke-width="54" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- 진행 게이지 -->
    <rect x="-96" y="132" width="192" height="30" rx="15" fill="#2A2F39"/>
    <rect x="-96" y="132" width="132" height="30" rx="15" fill="url(#g)"/>
  </g>
</svg>
